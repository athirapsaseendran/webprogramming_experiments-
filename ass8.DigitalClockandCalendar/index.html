<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock and Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Digital Clock</h1>

        <div id="clock"></div>

        <div id="date"></div>

        <div class="calendar">
            <h2 id="monthYear"></h2>

            <div class="days">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendarDays" class="calendar-days"></div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
